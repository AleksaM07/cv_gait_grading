flow:
  target_fps: 20
  size: [96, 96]
  mode: body_centered_residual_flow
  cache_dir: data/interim/flow/classical

motion_basis:
  max_components: 8
  explained_variance: null

model:
  ridge_alphas: [0.1, 1.0, 10.0, 100.0, 1000.0]

temporal:
  high_frequency_hz: 3.0

split:
  train_fraction: 0.70
  val_fraction: 0.15
  random_seed: 13
