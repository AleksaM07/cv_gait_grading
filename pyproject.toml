[project]
name = "visual-gait-quality-assessment"
version = "0.1.0"
description = "RGB-video gait quality assessment for simulated humanoid walking."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "pillow>=10",
  "opencv-python>=4.9",
  "scikit-learn>=1.4",
  "pyyaml>=6",
]

[project.optional-dependencies]
deep = ["torch>=2.2", "torchvision>=0.17"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
gait-aqa = "gait_aqa.cli:main"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
