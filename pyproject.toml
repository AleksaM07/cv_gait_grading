[project]
name = "visual-gait-quality-assessment"
version = "0.1.0"
description = "RGB-video gait quality assessment for simulated humanoid walking."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "pillow>=10",
  "loguru>=0.7",
  "opencv-python>=4.9",
  "pyyaml>=6",
]

[project.optional-dependencies]
render = ["mujoco>=3.2", "imageio-ffmpeg>=0.5"]
deep = ["torch>=2.6", "torchvision>=0.21"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
gait-aqa = "gait_aqa.cli:main"
render-cmu-mujoco = "gait_aqa.reference_videos.render_mujoco:main"
render-walker-rollouts = "gait_aqa.reference_videos.render_walker_rollouts:main"
prepare-transfer-manifests = "gait_aqa.data.build_transfer_manifests:main"
train-video-transfer = "gait_aqa.training.train_video_transfer:main"
score-video-transfer = "gait_aqa.training.train_video_transfer:score_main"
score-policy-transfer = "gait_aqa.training.train_video_transfer:score_policy_main"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# Logging goes through a typed adapter that intentionally supports Loguru `{}`
# placeholders; Pylint's stdlib-logging rule cannot recognize that protocol.
ignore = ["PLE1205"]

[tool.ruff.lint.per-file-ignores]
# A failed clip must be converted to a manifest row so a 580-file batch can
# continue; these boundary catches intentionally record arbitrary worker errors.
"src/gait_aqa/reference_videos/render_mujoco.py" = ["BLE001"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
